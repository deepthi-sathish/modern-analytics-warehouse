version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: dim_products
    columns:
      - name: product_key
        data_tests:
          - not_null
          - unique
      - name: product_number
        data_tests:
          - not_null
          - unique

  - name: fact_sales
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key