services:
  postgres:
    image: postgres:16
    container_name: warehouse_db
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./datasets:/data

volumes:
  pgdata: